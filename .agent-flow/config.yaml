# agent-flow project configuration
#
# Detected: node. Commands were read from the repository, not assumed.
# Only what differs from the global setup belongs here.
project:
  name: agent-flow
  type: node
commands:
  install: npm ci
  lint: npm run lint
  typecheck: npm run typecheck
  test: npm run test
  build: npm run build
validationCommands: {}
paths:
  source:
    - src
  tests:
    - test
rules:
  architecture: []
runners:
  agy:
    type: agy-cli
    enabled: true
    dangerouslySkipPermissions: true
  claude:
    enabled: false
roles:
  executors:
    trivial:
      runner: agy
    normal:
      runner: agy
    complex:
      runner: agy
  architect:
    runner: agy
  sdd:
    runner: agy
  planner:
    runner: agy
  planReviewer:
    runner: agy
  verification:
    runner: agy
  finalReviewer:
    runner: agy
