name: CI

on:
  push:
    # The repository's default branch. Written as a list because a rename is a
    # one-line change here and a silent no-op otherwise: the first version of
    # this file said `main`, the branch is `master`, and the workflow simply
    # never ran — a CI that reports nothing looks exactly like a CI that passes.
    branches: [master, main]
  pull_request:

# A second push to the same branch makes the first run irrelevant. Cancelling it
# is not only cheaper — a queue of stale runs makes the latest result harder to
# find, which is the one anybody actually wants.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action below is pinned to an immutable commit SHA with its version in a trailing
# comment. A tag is a pointer somebody else can move: `@v4` today and `@v4` tomorrow can be
# different code, running in a job that has this repository checked out and a token in its
# environment. The version comment is what keeps the pin readable, and Dependabot rewrites
# both halves together — see `.github/dependabot.yml`.
jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      # One version failing should not hide the result on the others.
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and the current LTS.
        # Testing only what the maintainer happens to run locally is how a
        # `>=20` claim quietly becomes untrue.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci` rather than `install`: the lockfile is the input, and a run that
      # silently resolved different versions would not be testing this commit.
      - run: npm ci

      # One command, and the list of what it runs lives in `scripts/gates.mjs`.
      #
      # It used to be seven `run:` lines here and a different seven in the `check`
      # script — which is how this job ran the dashboard's *tests* for a year without
      # ever running its *typecheck*, and how `test:packaging` stayed red for a whole
      # milestone with CI reporting it and no local command asking. Two hand-kept lists
      # of one contract is two answers to "is this green".
      - run: npm run gate:node

  # A browser, driven against the real local server (UI-31).
  #
  # In the pinned Playwright container because that is the one place a Chromium and
  # its dependencies are guaranteed present without a download step that can be a
  # different version tomorrow. Nothing here spends quota: the coding CLI is replaced
  # at the executable boundary by a deterministic script, which an architecture test
  # enforces.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The suite builds the CLI and the dashboard itself, in `globalSetup`, so a
      # green run cannot be a statement about an artifact from an earlier step.
      # `--ci` applies the lane's CI environment from the manifest rather than from
      # here. It matters most for the visual lane below — see the note there — and the
      # two lanes are kept the same shape so neither becomes the exception.
      - run: npm run gate:browser -- --ci

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/e2e/.results/
          retention-days: 7

  # Screenshot regression, on Linux, against Linux baselines (D32-C).
  #
  # One job, not a matrix: the suite renders a page, and a page does not render
  # differently under Node 20 than under Node 22. Duplicating it would double the
  # slowest job in this file to learn nothing.
  #
  # The container is the whole point. Baselines are platform-specific because font
  # rasterisation is, so "Linux" is not specific enough — the maintainer regenerates
  # these with `scripts/visual-linux.sh`, which uses this exact image, and
  # `test/visual-ci.test.ts` fails if the two ever name different versions.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The build happens inside the suite's own `webServer` command, so there is no
      # arrangement of steps in which this compares an old bundle (D32-A, D32-B).
      # The env this needs (`AF_VISUAL_BROWSER=chromium`) is declared in
      # `scripts/gates.mjs` and applied by `--ci`, deliberately not written here: a
      # developer who copied that line out of this file to "run it like CI" would
      # invalidate all 133 darwin baselines at once, because they were captured with
      # real Chrome and bundled Chromium rasterises type differently.
      - run: npm run gate:visual -- --ci

      # The expected, the actual and the diff for every mismatch. "Screenshot
      # comparison failed" without the images is a failure nobody can act on.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: visual-diff
          path: |
            apps/web/playwright-report/
            apps/web/visual/.results/
          retention-days: 7

  # Does the *published package* work outside this checkout? (UI-33)
  #
  # `npm run test` proves the source is correct and proves nothing about the tarball. A
  # `files` entry naming a path that does not exist, a runtime resolution that only works
  # because `src/` happens to be next door, a prompt that was never packaged — all of them
  # pass here and fail on the first person to run `npm i -g agent-flow`. The script packs,
  # installs into a temporary root with the checkout hidden, and drives the CLI.
  #
  # It existed before this job and ran nowhere, which is the same as not existing.
  packaging:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Both builds are the gate's declared prerequisites in the manifest, so the
      # ordering is canonical rather than repeated here.
      - run: npm run gate:packaging

  # Separated from `check` because coverage is a report, not a gate: a drop is
  # worth seeing without failing a pull request over a number.
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run gate:coverage
