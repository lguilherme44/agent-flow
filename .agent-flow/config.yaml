# agent-flow project configuration
#
# Detected: node. Commands were read from the repository, not assumed.
# Only what differs from the global setup belongs here.
project:
  name: agent-flow
  type: node
commands:
  install: npm ci
  lint: npm run lint
  typecheck: npm run typecheck
  test: npm run test
  build: npm run build
validationCommands: {}
paths:
  source:
    - src
  tests:
    - test
rules:
  architecture: []
runners:
  agy:
    type: agy-cli
    enabled: true
    dangerouslySkipPermissions: true
  claude:
    type: claude-code-cli
    enabled: false

roles:
  executors:
    trivial:
      runner: agy
      timeoutSeconds: 900
      effort: high
    normal:
      runner: agy
      timeoutSeconds: 1800
      effort: high
    complex:
      runner: agy
      timeoutSeconds: 2400
  architect:
    runner: agy
    timeoutSeconds: 2400
  sdd:
    runner: agy
    timeoutSeconds: 2400
  planner:
    runner: agy
    timeoutSeconds: 2400
  planReviewer:
    runner: agy
    timeoutSeconds: 2400
  verification:
    runner: agy
    timeoutSeconds: 2400
    effort: high
  e2e:
    enabled: true
    runner: agy
    effort: high
    timeoutSeconds: 2400
  finalReviewer:
    runner: agy
    timeoutSeconds: 2400
    effort: high
